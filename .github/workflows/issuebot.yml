name: Issue Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  issuebot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run issue bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/issuebot --once --repo-root .
